name: CI
on:
  push: { branches: [main, production-paid] }
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: tierra, POSTGRES_PASSWORD: tierra_dev, POSTGRES_DB: tierra_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tierra" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tierra:tierra_dev@localhost:5432/tierra_test
      DATABASE_URL_TEST: postgres://tierra:tierra_dev@localhost:5432/tierra_test
      SESSION_SECRET: ci-session-secret-ci-session-secret-1234567890
      DEMO_USER_PASSWORD: Ci-${{ github.run_id }}-${{ github.run_attempt }}#Tx
      APP_MODE: demo
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
        continue-on-error: true
      - run: npm run test:unit
      - run: npm run test:db
      - name: Production build (basePath /academy)
        run: npm run build
        env: { NEXT_PUBLIC_BASE_PATH: /academy, APP_MODE: production, NODE_ENV: production, NEXT_PUBLIC_APP_URL: "https://tierraautomation.in" }
      - name: Production smoke test under /academy
        env:
          APP_MODE: production
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /academy
          NEXT_PUBLIC_APP_URL: https://tierraautomation.in
          DATABASE_URL: postgres://tierra:tierra_dev@localhost:5432/tierra_prod
          DATA_ENCRYPTION_KEY: ci-data-encryption-key-ci-data-encryption-key
        run: |
          PGPASSWORD=tierra_dev psql -h localhost -U tierra -d tierra_test -c "create database tierra_prod"
          npm run db:migrate && npm run db:seed:production
          (npm run start > server.log 2>&1 &) ; sleep 10
          fail=0
          for p in /academy /academy/courses /academy/courses/robotics /academy/courses/embedded-systems /academy/login /academy/register /academy/api/health; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$p"); echo "$p -> $code"; [ "$code" = 200 ] || fail=1
          done
          for p in /academy/dashboard /academy/admin; do curl -s -o /dev/null -w "$p -> %{http_code} %{redirect_url}\n" "http://localhost:3000$p"; done
          curl -s http://localhost:3000/academy/courses/robotics | grep -q "6,000" && echo "robotics fee shown" || fail=1
          curl -s http://localhost:3000/academy/courses/embedded-systems | grep -q "4,500" && echo "45-day fee shown" || fail=1
          curl -s http://localhost:3000/academy/courses/robotics | grep -q "Enrollment opens soon" && echo "checkout closed until tax+payments configured" || fail=1
          curl -s http://localhost:3000/academy | grep -q "DEMO MODE" && { echo "demo banner visible in production"; fail=1; } || echo "no demo banner"
          css=$(curl -s http://localhost:3000/academy | grep -o '/academy/_next/static/[^"]*\.css' | head -1); echo "css $css -> $(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000$css)"
          [ $fail = 0 ] || { tail -40 server.log; exit 1; }
